<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꼭 읽어봐주세요 🥺🙏</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Fullscreen Flash Overlay -->
    <div id="flash-overlay"></div>

    <!-- Golden Sunburst Light Rays -->
    <div class="sunburst" id="sunburst"></div>

    <!-- Particle Fireworks & Confetti Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <main class="container">
      <!-- Shockwave Ring Element -->
      <div class="shockwave" id="shockwave"></div>

      <!-- Main Title Container Hierarchy -->
      <div class="title-wrapper" id="title-wrapper">
        <div class="title-effects" id="title-effects">
          <h1 class="main-title" id="main-title">
            <span class="shine-text" id="shine-text" data-text="PR 리뷰좀요"
              >PR 리뷰좀요</span
            >
          </h1>
        </div>
      </div>

      <!-- Cheeky Sequenced Subtexts -->
      <div class="subtext-container">
        <p class="subtext subtext-1" id="subtext-1">금방 끝나요 ^^</p>
        <p class="subtext subtext-2" id="subtext-2">진짜 별거 없어요</p>
        <p class="subtext subtext-3" id="subtext-3">아마도</p>
      </div>
    </main>

    <!-- Replay Button -->
    <button id="replay-btn" aria-label="애니메이션 다시 보기" title="다시 보기">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span>다시 연출 보기 🎉</span>
    </button>

    <script src="script.js"></script>
  </body>
</html>
